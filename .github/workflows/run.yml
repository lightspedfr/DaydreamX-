name: Build and Tunnel
on:
  workflow_dispatch:
  push:

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest
    env:
      PORT: 8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and missing placeholder package
        run: |
          npm install --include=dev
          npm install --no-save @mercuryworkshop/epoxy-transport

      - name: Build application
        run: npm run build

      - name: Start server and Pinggy tunnel
        run: |
          node server.js &
          sleep 3
          ssh -T -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:8080 a.pinggy.io
