name: Build, Run, and Pinggy Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-and-tunnel:
    runs-on: ubuntu-latest

    env:
      PORT: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all dependencies
        run: npm install --include=dev

      - name: Build application
        run: npm run build

      - name: Verify dependencies and start server
        run: |
          # Ensure node_modules exists before starting
          ls -la node_modules
          
          # Start the Node.js server in the background
          node server.js &
          sleep 3
          
          # Start Pinggy SSH tunnel
          ssh -T -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:8080 a.pinggy.io
